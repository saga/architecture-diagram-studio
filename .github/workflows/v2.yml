name: V2 CI

on:
  push:
    branches: [main]
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"
  pull_request:
    paths:
      - "v2/**"
      - ".github/workflows/v2.yml"

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Test layout and intent rules
        run: npm test
      - name: Build app and verify pinned local Draw.io bundle
        run: npm run build